<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head>
<body class="light"><canvas id="c"></canvas>
<div class="head"><img class="logo" src="logo-transparent.png"><h1>We changed the list,<br><span>not the copy.</span></h1><div class="sub">Use case: a field sales software company targeting competitor users</div></div>
<div class="callout">Every account confirmed to run the competing product.<br>Stop selling the category. Start selling the switch.</div>
<div class="foot"><div>5,000+ technologies · 100% tech usage guarantee</div><div>revnitymarketing.com</div></div>
<script type="module">
import {fit,THREE,makeStage,M,rbox,pin,project,tag} from './common.js';
const {r,scene,cam,W,H}=makeStage('c',{fov:28,camPos:[2.2,9,31],target:[2.2,1.2,0]});
// funnel via lathe
const prof=[];for(let i=0;i<=40;i++){const t=i/40;const y=t*4.2;const x=0.45+Math.pow(t,2.2)*2.4;prof.push(new THREE.Vector2(x,y));}
const fun=new THREE.Mesh(new THREE.LatheGeometry(prof,96),M.glass(0x9ff5d0,{side:THREE.DoubleSide,thickness:0.4,roughness:0.05,transmission:0.85}));
fun.position.set(-1.6,1.2,0);fun.rotation.z=-0.0;fun.castShadow=true;scene.add(fun);
const rim=new THREE.Mesh(new THREE.TorusGeometry(2.85,0.09,16,128),M.glossy(0x2bb5a8));rim.rotation.x=Math.PI/2;rim.position.set(-1.6,5.4,0);scene.add(rim);
const spout=new THREE.Mesh(new THREE.CylinderGeometry(0.48,0.48,1.2,48,1,true),M.glossy(0x2bb5a8,{side:THREE.DoubleSide}));spout.position.set(-1.6,0.6,0);scene.add(spout);
const stand=rbox(2.6,0.5,2.6,0.2,M.glossy(0xffffff,{roughness:0.3}));stand.position.set(-1.6,0.25-0.3,0);scene.add(stand);
// grey company tokens falling into funnel
const rnd=(i)=>((Math.sin(i*91.7)*43758.5)%1+1)%1;
for(let i=0;i<22;i++){const a=rnd(i)*6.28,rr=0.5+rnd(i+50)*2.0;const g=rbox(0.55,0.55,0.55,0.12,M.matte(0xcfd9da));
 g.position.set(-1.6+Math.cos(a)*rr,5.7+rnd(i+9)*1.3,Math.sin(a)*rr*0.6);g.rotation.set(rnd(i+3)*3,rnd(i+4)*3,0);scene.add(g);}
// output path: glowing track to 3 pins
const track=rbox(5.2,0.18,1.0,0.09,M.glossy(0xe9fbf4,{roughness:0.3}));track.position.set(2.3,0.09,0.6);scene.add(track);
const line=rbox(4.6,0.04,0.12,0.02,M.emissive(0x3fd98a,1.6));line.position.set(2.3,0.2,0.6);scene.add(line);
const pins=[];[[2.6,0.6],[3.7,0.6],[4.8,0.6]].forEach(([x,z],i)=>{const p=pin(0.45,0x10b981);p.position.set(x,0.2,z);scene.add(p);pins.push(p);});
const tgt=new THREE.Group();[1.4,1.0,0.6,0.25].forEach((rr,i)=>{const d=new THREE.Mesh(new THREE.CylinderGeometry(rr,rr,0.12+i*0.04,64),M.glossy(i%2?0xffffff:0x3fd98a));d.position.y=i*0.05;tgt.add(d);});
tgt.rotation.x=Math.PI/2.3;tgt.position.set(6.4,1.4,-0.6);tgt.traverse(o=>o.castShadow=true);scene.add(tgt);
fit(scene,cam,W,H,{top:440,bottom:1060,left:30,right:1050});r.render(scene,cam);
const f=project(rim,cam,W,H);tag('Companies with field reps',f[0],f[1]-150,'grey');
const p=project(pins[1],cam,W,H);tag('✓ Verified competitor users',p[0]+40,p[1]-110);
window.__done=true;
</script></body></html>

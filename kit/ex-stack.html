<body class="dark"><canvas id="c"></canvas>
<div class="head"><img class="logo" src="logo-transparent.png"><h1 style="color:#fff">Technographic data,<br><span>explained in plain English</span></h1><div class="sub">Five layers. The higher you go, the closer you are to a deal.</div></div>

import {fit,THREE,makeStage,M,project} from './common.js';
const {r,scene,cam,W,H}=makeStage('c',{fov:28,camPos:[0,12,25],target:[0,0.2,0]});

 m.position.y=0.31+i*0.86;m.castShadow=true;m.receiveShadow=true;scene.add(m);disks.push([m,rad]);
 const ring=new THREE.Mesh(new THREE.TorusGeometry(rad+0.02,0.035,12,128),M.emissive(0xbfffe6,0.9));ring.rotation.x=Math.PI/2;ring.position.y=m.position.y+0.31;scene.add(ring);});
